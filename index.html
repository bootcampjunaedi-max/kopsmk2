<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A5C47">
  <title>SIMPEL-KOP — Koperasi SMK Islam PB. Soedirman 2</title>
  <meta name="description" content="SIMPEL-KOP — Sistem Informasi Simpan Pinjam &amp; Barang Koperasi Konsumen Syariah SMK Islam PB. Soedirman 2">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F7B5F'/%3E%3Cg fill='none' stroke='%23E8F5F0' stroke-width='3'%3E%3Crect x='17' y='17' width='30' height='30'/%3E%3Crect x='17' y='17' width='30' height='30' transform='rotate(45 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='6' fill='%23D4A63A'/%3E%3C/svg%3E">
  <!-- Tema disetel sebelum render agar tidak berkedip -->
  <script>try{var t=localStorage.getItem('sk_theme');if(t){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Splash awal (hilang begitu shell siap — tanpa menunggu server bila ada cache di perangkat) -->
  <div id="bootSplash" class="boot-splash" role="status" aria-live="polite">
    <div>
      <svg class="boot-logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#E8F5F0"/><g fill="none" stroke="#0F7B5F" stroke-width="3"><rect x="17" y="17" width="30" height="30"/><rect x="17" y="17" width="30" height="30" transform="rotate(45 32 32)"/></g><circle cx="32" cy="32" r="6" fill="#D4A63A"/></svg>
      <p>Memuat SIMPEL-KOP…</p>
    </div>
  </div>

  <noscript><div style="padding:24px;font-family:sans-serif;text-align:center">SIMPEL-KOP membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</div></noscript>

  <!-- Halaman masuk & verifikasi dokumen (publik) -->
  <div id="viewAuth" class="auth-view" hidden></div>
  <div id="viewVerify" class="auth-view" hidden></div>

  <!-- ═══ SHELL APLIKASI SPA (semua halaman dimuat sekali) ═══ -->
  <div id="app" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar khatam-bg" aria-label="Navigasi utama">
      <span class="khatam-star"></span>
      <div class="sb-brand">
        <div class="logo-box" id="sbLogo"></div>
        <div><b id="sbAppName">SIMPEL-KOP</b><span id="sbSchool">SMK Islam PB. Soedirman 2</span></div>
      </div>
      <nav><ul class="sb-nav" id="sbNav"></ul></nav>
      <div class="sb-foot" id="sbFoot"></div>
    </aside>
    <div id="sbBackdrop" class="sidebar-backdrop" onclick="UI.closeSidebar()"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn tb-menu" type="button" onclick="UI.toggleSidebar()" aria-label="Buka menu navigasi"><i class="bi bi-list"></i></button>
        <div class="tb-brand" id="tbBrand"></div>
        <button class="tb-search" type="button" onclick="Search.open()" aria-label="Cari">
          <i class="bi bi-search"></i><span>Cari anggota, no. pinjaman, transaksi…</span><kbd>Ctrl + K</kbd>
        </button>
        <div class="tb-spacer"></div>
        <span id="syncChip" class="sync-chip ok" onclick="Sync.chipClick()" title="Status sinkronisasi"><i class="bi bi-cloud-check"></i><span>Tersinkron</span></span>
        <span id="rolePill" class="role-pill">—</span>
        <button class="icon-btn d-md-none" type="button" onclick="Search.open()" aria-label="Cari"><i class="bi bi-search"></i></button>
        <button class="icon-btn hide-sm" type="button" onclick="UI.toggleTheme()" aria-label="Ganti mode terang/gelap"><i class="bi bi-moon-stars" id="themeIcon"></i></button>
        <div class="dropdown">
          <button class="icon-btn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-label="Notifikasi" onclick="Notif.render()">
            <i class="bi bi-bell"></i><span class="dot" id="notifDot" hidden></span>
          </button>
          <div class="dropdown-menu dropdown-menu-end notif-menu" id="notifMenu"></div>
        </div>
        <div class="dropdown">
          <button class="user-chip" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu akun">
            <span class="avatar c5" id="userAvatar">?</span>
            <span class="u-text"><b id="userName">—</b><span id="userRole">—</span></span>
            <i class="bi bi-chevron-down small text-muted hide-sm"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="javascript:void(0)" onclick="Nav.go(Nav.profilePage())"><i class="bi bi-person-circle"></i> Profil & Akun</a></li>
            <li><a class="dropdown-item" href="javascript:void(0)" onclick="Pages.profil.gantiSandi()"><i class="bi bi-key"></i> Ganti Kata Sandi</a></li>
            <li><a class="dropdown-item" href="javascript:void(0)" onclick="UI.toggleTheme()"><i class="bi bi-circle-half"></i> Mode Terang / Gelap</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i> Keluar</a></li>
          </ul>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1">
        <!-- Halaman staf (Admin / Bendahara / Pengawas) -->
        <section class="page" id="page-dashboard"></section>
        <section class="page" id="page-anggota"></section>
        <section class="page" id="page-anggota-detail"></section>
        <section class="page" id="page-simpanan"></section>
        <section class="page" id="page-pinjaman"></section>
        <section class="page" id="page-pinjaman-form"></section>
        <section class="page" id="page-pinjaman-detail"></section>
        <section class="page" id="page-angsuran"></section>
        <section class="page" id="page-stok"></section>
        <section class="page" id="page-laporan"></section>
        <section class="page" id="page-biaya"></section>
        <section class="page" id="page-dokumen"></section>
        <section class="page" id="page-pengaturan"></section>
        <section class="page" id="page-log"></section>
        <section class="page" id="page-profil"></section>
        <!-- Halaman anggota -->
        <section class="page" id="page-m-beranda"></section>
        <section class="page" id="page-m-transaksi"></section>
        <section class="page" id="page-m-pinjaman"></section>
        <section class="page" id="page-m-ajukan"></section>
      </main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi bawah"></nav>
    <button class="fab" id="fab" type="button" onclick="UI.fab()"><i class="bi bi-plus-lg"></i><span id="fabLabel">Ajukan</span></button>
  </div>

  <!-- Modal umum (formulir) -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" id="appModalDialog">
      <div class="modal-content" id="appModalContent"></div>
    </div>
  </div>
  <!-- Modal konfirmasi -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content" id="confirmContent"></div></div>
  </div>
  <!-- Modal pratinjau dokumen PDF -->
  <div class="modal fade" id="docModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content" id="docContent"></div></div>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <!-- Pencarian global (Ctrl + K) -->
  <div id="cmdk" class="cmdk" role="dialog" aria-modal="true" aria-label="Pencarian global" onclick="if(event.target===this)Search.close()">
    <div class="cmdk-box">
      <div class="cmdk-in"><i class="bi bi-search"></i><input id="cmdkInput" type="search" placeholder="Ketik nama anggota, NIK, no. pinjaman, no. bukti…" autocomplete="off" oninput="Search.query(this.value)" onkeydown="Search.key(event)"><kbd class="xs muted">Esc</kbd></div>
      <div class="cmdk-res" id="cmdkRes"></div>
    </div>
  </div>

  <!-- Action sheet (aksi cepat FAB) -->
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-bg" onclick="UI.closeSheet()"></div>
    <div class="sheet-box"><div class="grab"></div><h4 id="sheetTitle">Aksi Cepat</h4><div class="sheet-grid" id="sheetGrid"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <!-- Urutan WAJIB: config → api → core → pages -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
